[project]
name = "anonymization-in-time"
version = "1.1.1"
description = "AiT (Anonymization in Time) - Video anonymization tool for chat recordings"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }
authors = [
    { name = "Matteo Boi" },
    { name = "University of Bern, Data Science Lab" },
]
keywords = [
    "anonymization",
    "video",
    "ocr",
    "segmentation",
    "privacy",
    "sam3",
    "easyocr",
    "doctr",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

dependencies = [
    "numpy<2",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "easyocr>=1.7.1",
    "python-doctr[torch]>=0.9.0",
    "einops>=0.6.1",
    "torch>=2.0",
    "transformers>=4.46.0",
    "ultralytics>=8.0.114",
    "scikit-learn>=1.4.0",
    "pycocotools>=2.0.6",
    "timm>=1.0.0",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0.0",
]

# Ultralytics' SAM3 text prompts need their CLIP fork, which it normally
# pip-installs at runtime — impossible in pip-less uv venvs. A dependency
# group (not published metadata, so PyPI accepts the git URL) lets
# `uv sync` install it up front.
[dependency-groups]
dev = [
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]

[project.urls]
Homepage = "https://github.com/dsl-unibe-ch/Anonymization-in-Time"
Repository = "https://github.com/dsl-unibe-ch/Anonymization-in-Time"
Issues = "https://github.com/dsl-unibe-ch/Anonymization-in-Time/issues"

[project.scripts]
ait = "ait.launcher:main"
ait-process = "ait.process_videos:main"
ait-viewer = "ait.annotation_viewer:main"
ait-export = "ait.export_video:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ait"]
